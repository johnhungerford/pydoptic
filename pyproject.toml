[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pydoptic"
dynamic = ["version"]
authors = [{ name = "John Hungerford" }]
urls = { Source = "https://github.com/johnhungerford/pydoptic" }
description = "Model data using reified optics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8,<3.14"
dependencies = [
    "jsonschema==4.25.1",
    "elasticsearch==8.14.0",
    "psycopg[binary]==3.2.12"
]

[project.optional-dependencies]
test = [
    "pytest~=8.4.2",
]
types = [
    "mypy~=1.18.2",
    "types-jsonschema~=4.25.1"
]
benchmark = [
    "pydantic~=2.11",
]

[tool.setuptools_scm]
# Version is derived entirely from git tags (v1.2.3 -> 1.2.3) -- no version field to hand-edit or
# forget to bump. `no-guess-dev` avoids speculatively bumping the next version between tags (just
# appends `.devN`); `no-local-version` drops the `+g<sha>` local segment, since PyPI/TestPyPI reject
# any version containing one.
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"

[tool.pytest.ini_options]
markers = [
    "integration: requires live external services (Postgres, Elasticsearch) started via docker-compose.yml; excluded by default, opt in with `-m integration`",
]
addopts = "-m 'not integration'"
