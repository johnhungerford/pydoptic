[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pydoptic"
version = "0.0.1"
authors = [{ name = "John Hungerford" }]
urls = { Source = "https://github.com/johnhungerford/pydoptic" }
description = "Model data using reified optics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8,<3.14"
dependencies = [
    "jsonschema==4.25.1",
    "elasticsearch==8.14.0",
    "psycopg[binary]==3.2.12"
]

[project.optional-dependencies]
test = [
    "pytest~=8.4.2",
]
types = [
    "mypy~=1.18.2",
    "types-jsonschema~=4.25.1"
]
benchmark = [
    "pydantic~=2.11",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires live external services (Postgres, Elasticsearch) started via docker-compose.yml; excluded by default, opt in with `-m integration`",
]
addopts = "-m 'not integration'"
