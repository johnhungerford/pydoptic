# Global options

[mypy]
check_untyped_defs = True
warn_return_any = True
warn_unused_configs = True
# pydoptic_sql/pydoptic_elastic import pydoptic; each package now has its own src/ root (see
# packages/*/pyproject.toml), so mypy needs all three on its search path to resolve cross-package
# imports when checking any one of them. Invoke as `mypy packages --config-file mypy.ini`.
mypy_path = packages/pydoptic/src:packages/pydoptic-sql/src:packages/pydoptic-elastic/src
exclude = ^benchmarks/
