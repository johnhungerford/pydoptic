[pytest]
# Local-dev convenience only: lets you run `pytest packages -q` across all three packages at once
# after installing them editable (see CONTEXT.md). CI runs each package's own tests independently
# (using its own pyproject.toml's [tool.pytest.ini_options]), not this file -- pytest stops at the
# nearest ini file walking up from wherever it's invoked, so this one is never even seen in CI.
markers =
    integration: requires live external services (Postgres, Elasticsearch) started via docker-compose.yml; excluded by default, opt in with -m integration
addopts = -m "not integration"
