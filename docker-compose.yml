services:
  elastic:
    container_name: elastic
    hostname: elastic
    image: elasticsearch:8.14.3
    user: "elasticsearch"
    environment:
      - cluster.name=elasticsearch
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms2G -Xmx10G"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --silent --fail localhost:9200/_cluster/health || exit 1",
        ]
      interval: 30s
      timeout: 30s
      retries: 3
    ports:
      - 9200:9200
    networks:
      - pydoptic-test

networks:
  pydoptic-test:
