name: Unit Tests

on:
  push:
    branches-ignore:
      - main
  pull_request:

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [pydoptic, pydoptic-sql, pydoptic-elastic]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        # pydoptic-sql/pydoptic-elastic depend on pydoptic; installing it editable first means pip's
        # resolver is satisfied by this checkout's copy instead of fetching one from PyPI.
        run: |
          pip install -e packages/pydoptic
          pip install -e "packages/${{ matrix.package }}[test]"

      - name: Run unit tests
        # Integration tests are excluded by default (see each package's pyproject.toml addopts);
        # they require live services and run only in integration-tests.yml.
        run: cd packages/${{ matrix.package }} && python -m pytest test -q
